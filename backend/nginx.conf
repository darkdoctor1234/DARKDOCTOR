# Reverse proxy + static file server for the app, running on the EC2
# instance. Plain HTTP only on purpose — TLS is terminated in front of this
# (an Application Load Balancer with an ACM certificate is the standard,
# low-maintenance AWS way to do this; see HANDOVER.md's deployment section).
# Don't add certbot/Let's Encrypt here unless that plan changes.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;  # review images / proof-document uploads

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Pass through the ALB's real scheme unmodified — $scheme here is
        # always "http" (nginx itself only ever receives plain HTTP), so
        # using it would silently tell Django every request is insecure,
        # even the ones the ALB terminated as real HTTPS. That mismatch
        # would cause the same infinite-redirect loop SECURE_PROXY_SSL_HEADER
        # was added to prevent — just re-introduced one hop earlier.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
