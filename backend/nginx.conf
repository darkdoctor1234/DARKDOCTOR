# Reverse proxy + static file server for the app, running on the EC2
# instance. TLS is terminated here directly via a free Let's Encrypt
# certificate (see docker-compose.yml's `certbot` service for how to
# issue/renew it) — no ALB in front, to avoid its ~$16-20/month cost while
# this is still a single-box, budget-conscious test deployment.

server {
    listen 80;
    server_name api.darkdoctor.in;

    # Let's Encrypt's HTTP-01 domain-ownership challenge reads from here —
    # needed on every renewal, so this stays even though real traffic is
    # redirected to HTTPS below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.darkdoctor.in;

    ssl_certificate     /etc/letsencrypt/live/api.darkdoctor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.darkdoctor.in/privkey.pem;

    client_max_body_size 10M;  # review images / proof-document uploads

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx itself terminates TLS here (no ALB in this architecture),
        # so its own $scheme is the correct, trustworthy source of truth —
        # this block only ever serves requests that arrived over real
        # HTTPS, so this is always "https".
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
