# Reverse proxy + static file server, installed directly on the EC2
# instance (no container — see darkdoctor.service in this folder for the
# gunicorn side). Plain HTTP only on purpose — TLS is terminated in front
# of this (an Application Load Balancer with an ACM certificate is the
# standard, low-maintenance AWS way to do this; see HANDOVER.md's
# deployment section). Don't add certbot/Let's Encrypt here unless that
# plan changes.
#
# Install: copy this file to /etc/nginx/sites-available/darkdoctor, symlink
# it into /etc/nginx/sites-enabled/, remove the default site, then
# `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;  # review images / proof-document uploads

    # Adjust this path if the repo isn't cloned to this exact location —
    # must match STATIC_ROOT (backend/config/settings/base.py) on the box.
    location /static/ {
        alias /home/ubuntu/DARKDOCTOR/backend/staticfiles/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
