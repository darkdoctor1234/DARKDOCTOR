# Reverse proxy + static file server for the app, running on the EC2
# instance. Plain HTTP only on purpose — TLS is terminated in front of this
# (an Application Load Balancer with an ACM certificate is the standard,
# low-maintenance AWS way to do this; see HANDOVER.md's deployment section).
# Don't add certbot/Let's Encrypt here unless that plan changes.

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;  # review images / proof-document uploads

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
