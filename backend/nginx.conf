# Reverse proxy + static file server for the app, running on the EC2
# instance. TLS is terminated here directly via a free Let's Encrypt
# certificate (see docker-compose.yml's `certbot` service for how to
# issue/renew it) — no ALB in front, to avoid its ~$16-20/month cost while
# this is still a single-box, budget-conscious test deployment.
#
# Bootstrap note: this file only has the plain-HTTP server block below
# until a real certificate exists on disk (nginx refuses to start if
# ssl_certificate points at a missing file). Run the `certbot certonly`
# command from docker-compose.yml's comment first, THEN uncomment/add the
# 443 server block — see HANDOVER.md's deployment section for the full
# step-by-step.

server {
    listen 80;
    server_name api.darkdoctor.in;

    client_max_body_size 10M;  # review images / proof-document uploads

    # Let's Encrypt's HTTP-01 domain-ownership challenge reads from here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Bootstrap-only block (see header comment) — no ALB in this
        # architecture, so there's no upstream scheme to trust here. Once
        # the 443 block exists, real app traffic is served there instead,
        # with X-Forwarded-Proto set from nginx's own $scheme (nginx is the
        # actual TLS-termination point now, so that's the correct source of
        # truth, not a client-supplied header).
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
