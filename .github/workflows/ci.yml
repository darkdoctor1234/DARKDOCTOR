name: CI

# Runs on every push to any branch (so a branch shows red/green before you
# ever open a PR) and again on pull requests targeting main/master — that
# second run is what branch protection should require to pass before merge.
on:
  push:
    branches-ignore: []
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend tests (Django)
    runs-on: ubuntu-latest

    # A real, throwaway Postgres for the test run — never Neon. Django's test
    # runner creates/drops its own test_* database on top of this on every
    # run, so no state persists between CI runs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: darkdoctor_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system checks
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: darkdoctor_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: python manage.py check

      - name: Run test suite
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DB_NAME: darkdoctor_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: "5432"
          DJANGO_SETTINGS_MODULE: config.settings.development
          # REDIS_URL and AWS_STORAGE_BUCKET_NAME deliberately left unset —
          # both features fall back to local-dev-safe defaults (in-memory
          # cache, local disk storage) when unset, so tests need neither a
          # real Redis instance nor real Supabase/S3 credentials.
        run: python manage.py test modules --verbosity=2

  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (blocking — this is what actually deploys to Vercel)
        run: npm run build

      - name: Lint (informational only)
        # Pre-existing lint debt (mostly a newer React-Compiler rule flagging
        # setState-in-effect patterns across ~20 files) hasn't been cleaned up
        # yet, so this reports rather than blocks — flip to blocking once
        # that's paid down. Never skip it silently: read the annotation.
        run: npm run lint
        continue-on-error: true
